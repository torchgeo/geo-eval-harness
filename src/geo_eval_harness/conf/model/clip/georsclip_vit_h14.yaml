name: clip/georsclip_vit_h14
target: geo_eval_harness.models.CLIPVisionBench
supports_model_normalization: true
kwargs:
  variant: georsclip_vit_h14
  pretrained: true
  pool: proj
input:
  bands: rgb
  image_size: 224
  normalization: model
segmentation:
  lora_target_modules: 'blocks\.\d+\.(attn\.(qkv|proj)|mlp\.fc[12])'
  layers:
    - blocks.31
    - blocks.23
    - blocks.15
    - blocks.7
