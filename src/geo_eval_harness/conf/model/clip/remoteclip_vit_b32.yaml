name: clip/remoteclip_vit_b32
target: geo_eval_harness.models.CLIPVisionBench
supports_model_normalization: true
kwargs:
  variant: remoteclip_vit_b32
  pretrained: true
  pool: proj
input:
  bands: rgb
  image_size: 224
  normalization: model
segmentation:
  lora_target_modules: 'blocks\.\d+\.(attn\.(qkv|proj)|mlp\.fc[12])'
  layers:
    - blocks.11
    - blocks.8
    - blocks.5
    - blocks.2
