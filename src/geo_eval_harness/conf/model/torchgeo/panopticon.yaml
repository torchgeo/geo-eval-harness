name: tgeo_panopticon
target: geo_eval_harness.models.TorchGeoPanopticonBench
kwargs:
  factory: panopticon_vitb14
  weights_class: Panopticon_Weights
  weights_member: VIT_BASE14
  auto_resize: true
  target_size: 224
segmentation:
  lora_target_modules: 'model\.blocks\.\d+\.(attn\.(qkv|proj)|mlp\.fc[12])'
  layers:
    - model.blocks.11
    - model.blocks.8
    - model.blocks.5
    - model.blocks.2
