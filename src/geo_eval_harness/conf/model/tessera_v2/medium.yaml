name: tessera_v2/medium
target: geo_eval_harness.models.TesseraBenchModel
supported_datasets: [benv2, m-bigearthnet, pastis, treesatai, fotw, eurosat, sen1floods11-s2]
kwargs:
  variant: medium
  embedding_dim: 128
  batch_pixels: 1024
  fallback_doy: 183
  protocol: s2-snapshot-v1
  weights_revision: 8c80b926f67cb0b44c2cd41d0226e61741503b9a
  source_revision: e368539f7c4711e5f16fdd09801573830e34baf9
input:
  bands: all
  normalization: model
  image_size: null
segmentation:
  head: linear
  cache_features: false
  layers: [spatial_features]
  lora_target_modules: 's2_backbone\.transformer_encoder\.layers\.\d+\.linear[12]'
dataset_overrides:
  benv2:
    input:
      bands: [b04, b02, b03, b08, b8a, b05, b06, b07, b11, b12]
  treesatai:
    input:
      bands: [b04, b02, b03, b08, b8a, b05, b06, b07, b11, b12]
  pastis:
    input:
      bands: [b04, b02, b03, b08, b8a, b05, b06, b07, b11, b12]
