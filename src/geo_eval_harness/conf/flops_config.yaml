# Synthetic compute measurements: select a preset with --model, or add
# model: {name: custom, target: my_package.MyModel, kwargs: {...}}.
# Explicit flags override this YAML; omitted input size and probe layers inherit
# model/dataset defaults. Native-size presets use 224 for synthetic measurements.
schema_version: 1
runtime:
  device: cuda
  seed: 0
  verbose: true

input:
  band_source: cloudsen12
  band_configs: [rgb, s2]  # s2 means all source bands: twelve optical S2 bands here.
  normalization: dataset

classification:
  head: linear  # mlp adds a D-by-D projection before the classifier.
  num_classes: 10

segmentation:
  heads: [fpn, dpt]  # Also linear, conv_block, patch_linear; [] disables this sweep.
  band_configs: [rgb, s2]
  num_classes: 4
  # Set probe.layers explicitly to override a preset; [] disables segmentation.

timing:
  batch_size: 64  # Timing and memory use this batch; FLOPs counts one sample.
  n_warmup: 3
  n_measure: 20

output:
  directory: results
  file: null
  resume: true
