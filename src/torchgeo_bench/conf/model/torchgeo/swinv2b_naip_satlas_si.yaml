name: tgeo_swinv2b_naip_satlas_si
target: torchgeo_bench.models.TorchGeoSwinBench
kwargs:
  factory: swin_v2_b
  weights_class: Swin_V2_B_Weights
  weights_member: NAIP_RGB_SI_SATLAS
  auto_resize: true
  target_size: 256
segmentation:
  lora_target_modules: 'features\.\d+\.\d+\.(attn\.(qkv|proj)|mlp\.[03])'
  layers:
    - features.7
    - features.5
    - features.3
    - features.1
