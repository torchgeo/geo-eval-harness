name: tgeo_dofa_base
target: torchgeo_bench.models.TorchGeoDOFABench
kwargs:
  factory: dofa_base_patch16_224
  weights_class: DOFABase16_Weights
  weights_member: DOFA_MAE
  auto_resize: true
  target_size: 224
segmentation:
  lora_target_modules: 'blocks\.\d+\.(attn\.(qkv|proj)|mlp\.fc[12])'
  layers:
    - blocks.11
    - blocks.8
    - blocks.5
    - blocks.2
