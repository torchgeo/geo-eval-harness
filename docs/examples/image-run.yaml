# Core image benchmark configuration (schema version 1).
# Every field below is explicit with its default value (except device: auto for portability). Omit fields to inherit model/dataset defaults.
schema_version: 1
model:
  name: timm/resnet50
datasets:
  - m-eurosat
input:
  bands: rgb
  partition: default
  time_steps: null
  image_size: 224
  interpolation: bilinear
  normalization: dataset
classification:
  methods: [knn, linear]
  knn_k: 5
  knn_device: null
  linear:
    c_log10_start: -6.0
    c_log10_stop: 4.0
    c_count: 40
    refit_train_val: true
  calibration:
    n_bins_knn: null
    n_bins_linear: 15
    temp_scale: false
  bootstrap_samples: 200
  feature_standardize: false
segmentation:
  head: fpn
  neck: none
  neck_norm: layernorm
  upsampler: none
  weight_decay: 0.0
  head_dropout: 0.0
  early_stopping_patience: null
  layers: []
  learning_rate: 1e-3
  epochs: 10
  batch_size: 64
  temporal_pool: mean
  scheduler: cosine
  ignore_index: 255
  cache_features: true
  cache_dtype: float16
  amp: fp16
  lora_rank: null
  lora_target_modules: null
  lora_alpha: 16.0
  lora_last_blocks: null
  backbone_learning_rate: null
  full_finetune: false
  feature_standardize: false
  gradient_checkpointing: false
  sweep_learning_rates: []
  sweep_weight_decays: [0.0]
runtime:
  device: auto
  batch_size: 64
  workers: 4
  seed: 0
  verbose: false
  sample_cache: none
  sample_cache_dir: ~/.cache/geo_eval_harness/samples
  matmul_precision: highest
output:
  directory: results
  file: null
  resume: false
  epoch_metrics: null
profile:
  enabled: false
  n_warmup: 3
  n_measure: 20
  cpu_throughput:
    enabled: false
    batch_size: 8
    n_warmup: 1
    n_measure: 5
    time_budget_s: 300.0
intrinsic_dim:
  enabled: false
  estimators: [TwoNN, MLE, lPCA]
  splits: [train]
  max_samples: 10000
  device: null
