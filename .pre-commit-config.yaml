repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: b831c3dc5d27d9da294ae4e915773b99aa24a7c5  # v0.15.10
    hooks:
      - id: ruff
        exclude: ^(src/geo_eval_harness/config/schema\.py|src/geo_eval_harness/cli\.py|src/geo_eval_harness/legacy_run\.py|src/geo_eval_harness/preprocessing\.py|src/geo_eval_harness/commands)
        args: ["--fix", "--show-fixes"]
      - id: ruff-format
        exclude: ^(src/geo_eval_harness/config/schema\.py|src/geo_eval_harness/cli\.py|src/geo_eval_harness/legacy_run\.py|src/geo_eval_harness/preprocessing\.py|src/geo_eval_harness/commands)

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 4c4bc90ba8bfd4e1609063a467d8e8146a913e44  # 1.2.0
    hooks:
      - id: pyrefly-check
        language: system
        entry: uv run pyrefly check
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: sort-simple-yaml
      - id: pretty-format-json
        exclude: ^(slides-js/|docs/_static/_results_snapshots/|docs/_static/_dataset_geography/)
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        # The results explorer and its snapshots are generated artifacts that
        # inline every result row; they are legitimately tens of MB.
        exclude: ^docs/_static/(_results_snapshots/.*\.json|results-explorer\.html)$
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: requirements-txt-fixer

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # v2.30.3
    hooks:
      - id: pyproject-fmt

  - repo: local
    hooks:
      - id: explicit-except
        name: Require a reason for exception recovery
        language: pygrep
        types: [python]
        args: [--multiline]
        entry: '^[ \t]*except\b(?![^:]*:[ \t]*# allow-except: \S)'
      - id: uv-lock
        name: Lock dependencies with uv
        entry: uv lock
        language: system
        pass_filenames: false
