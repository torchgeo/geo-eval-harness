name: Ranking explorer

# The ranking explorer page is a build artifact of the committed result CSVs.
# This only recomputes the rankings from those CSVs -- it never runs a model.
# On main it opens a refresh PR (main is protected, so CI never pushes to it);
# on a PR it proves the regeneration still works and uploads a preview.

on:
  push:
    branches: [main]
    paths:
      - "results/models/**/*.csv"
      - "results/compute_cost.csv"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ranking-explorer.yaml"
      - "results/models/**/*.csv"
      - "results/compute_cost.csv"
  workflow_dispatch:

# Serialise main runs: two runs regenerating the same page would race on the
# refresh branch.  Superseded PR runs are cancelled.
concurrency:
  group: ranking-explorer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regenerate:
    name: Regenerate ranking explorer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      # evaluma, the ranking backend, is in the dev extra.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Views are ranked in parallel, one process per runner CPU.
      - name: Regenerate
        run: uv run --frozen python scripts/regen_leaderboard.py

      - name: Show what changed
        run: git --no-pager diff --stat

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ranking-explorer
          path: docs/_static/ranking_explorer.html
          retention-days: 14

      # Requires Settings -> Actions -> General -> "Allow GitHub Actions to
      # create and approve pull requests".
      - name: Open refresh PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          # Reuses one branch, so repeated result merges update the open PR.
          branch: automation/ranking-explorer
          base: main
          add-paths: |
            docs/_static/ranking_explorer.html
          commit-message: "chore(docs): refresh ranking explorer from results/*.csv"
          title: "chore(docs): refresh ranking explorer"
          body: |
            Regenerated `docs/_static/ranking_explorer.html` from the result
            CSVs on `main` via `scripts/regen_leaderboard.py`.

            Opened automatically because `results/models/**/*.csv` or
            `results/compute_cost.csv` changed. No models were run; only the
            rankings were recomputed.

            Triggered by ${{ github.sha }}.
          labels: automation
          delete-branch: true
