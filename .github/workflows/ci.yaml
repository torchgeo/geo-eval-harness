name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            extras: --extra dev --extra id --extra olmoearth
            cache-tag: dev-id-olmoearth
          - os: macos-latest
            extras: --extra dev
            cache-tag: dev
          - os: windows-latest
            extras: --extra dev
            cache-tag: dev
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Cache .venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ matrix.cache-tag }}
      - name: Install dependencies
        run: uv sync ${{ matrix.extras }} --frozen
      - name: Run tests
        run: uv run pytest -n auto --dist=loadfile
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install (CPU only, no [cuda] extra)
        run: uv sync --frozen
      - name: Smoke test (CLI entry point)
        run: uv run geo-eval-harness --help

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Cache .venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-dev-id
      - name: Install dependencies
        run: uv sync --extra dev --extra id --frozen
      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: uv run pre-commit run --all-files -v

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Build and validate distributions
        run: |
          uv build --no-sources
          uv run --no-project python scripts/check_distributions.py
          uvx twine check --strict dist/*
      - name: Install wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/package-env"
          uv pip install --python "$RUNNER_TEMP/package-env/bin/python" dist/*.whl
      - name: Exercise installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          package-env/bin/geo-eval-harness --version
          package-env/bin/geo-eval-harness models rcf
          package-env/bin/geo-eval-harness datasets m-eurosat
          package-env/bin/python -I -m geo_eval_harness run --model rcf --dataset m-eurosat --device cpu --dry-run
          package-env/bin/python -I -m geo_eval_harness.cli --help
