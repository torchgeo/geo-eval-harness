name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pull requests that only change results/models/*.csv leave the code untouched. Their test
  # cells still run, so the required `test (<os>, <python>)` checks report success, but skip
  # every step, except that the required ubuntu/3.13 cell runs the tests that read the committed
  # CSVs (tests/test_setup_columns.py, tests/test_results_store.py).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      results_only: ${{ steps.filter.outputs.results_only }}
    steps:
      - name: Detect results-only pull requests
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          results_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            if [ -n "$files" ] && ! grep -Evq '^results/models/[^/]+\.csv$' <<<"$files"; then
              results_only=true
            fi
          fi
          echo "results_only=$results_only" | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            extras: --extra dev --extra id --extra olmoearth
            cache-tag: dev-id-olmoearth
          - os: macos-latest
            extras: --extra dev
            cache-tag: dev
          - os: windows-latest
            extras: --extra dev
            cache-tag: dev
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      OMP_NUM_THREADS: "1"
      KMP_DUPLICATE_LIB_OK: "TRUE"
      RUN_TESTS: ${{ needs.changes.outputs.results_only != 'true' }}
      RUN_RESULTS_TESTS: ${{ needs.changes.outputs.results_only == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
      SETUP: ${{ needs.changes.outputs.results_only != 'true' || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13') }}
    steps:
      - name: Skip (results-only pull request)
        if: env.RUN_TESTS != 'true'
        shell: bash
        run: echo "Only results/models/*.csv changed; full test suite skipped." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        if: env.SETUP == 'true'
      - uses: actions/setup-python@v6
        if: env.SETUP == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.0.0
        if: env.SETUP == 'true'
        with:
          enable-cache: true
      - name: Enable Git long paths (Windows)
        if: env.RUN_TESTS == 'true' && runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Cache .venv
        if: env.SETUP == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .venv
          key: venv-matrix-v2-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ matrix.cache-tag }}
      - name: Install dependencies
        if: env.SETUP == 'true'
        run: uv sync ${{ matrix.extras }} --frozen
      - name: Verify Python version
        if: env.SETUP == 'true'
        run: >-
          uv run python -c "import os, sys;
          expected = os.environ['UV_PYTHON']; actual = '.'.join(map(str, sys.version_info[:2]));
          print(sys.version);
          sys.exit(0 if actual == expected else f'Expected Python {expected}, got {actual}')"
      # Geography store checks are platform-independent; the `geography` job runs them once.
      - name: Run tests
        if: env.RUN_TESTS == 'true'
        run: uv run pytest -n auto --dist=loadfile --durations=10 -m "not slow and not accuracy_check and not geography"
      - name: Run committed-results tests (results-only pull request)
        if: env.RUN_RESULTS_TESTS == 'true'
        run: uv run pytest --no-cov tests/test_setup_columns.py tests/test_results_store.py
      - name: Save coverage report
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: env.RUN_TESTS == 'true' && runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  geography:
    needs: changes
    if: needs.changes.outputs.results_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Cache .venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-dev
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Run geography tests
        run: uv run pytest -m geography
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Enable Git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install (CPU only, no [cuda] extra)
        run: uv sync --frozen
      - name: Smoke test (CLI entry point)
        run: uv run geo-eval-harness --help

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Cache .venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.13-${{ hashFiles('uv.lock') }}-dev-id
      - name: Install dependencies
        run: uv sync --extra dev --extra id --frozen
      - name: Cache pre-commit hooks
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Audit locked dependencies
        run: uv audit --locked
      - name: Run pre-commit
        run: uv run pre-commit run --all-files -v

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - name: Build and validate distributions
        run: |
          uv build --no-sources
          uv run --no-project python scripts/check_distributions.py
          uvx twine check --strict dist/*
      - name: Install wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/package-env"
          uv pip install --python "$RUNNER_TEMP/package-env/bin/python" dist/*.whl
      - name: Exercise installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          package-env/bin/geo-eval-harness --version
          package-env/bin/geo-eval-harness models rcf
          package-env/bin/geo-eval-harness datasets m-eurosat
          package-env/bin/python -I -m geo_eval_harness run --model rcf --dataset m-eurosat --device cpu --dry-run
          package-env/bin/python -I -m geo_eval_harness.cli --help
      - name: Load packaged geography outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          package-env/bin/python -I - <<'PYTHON'
          from geo_eval_harness.geography import list_geography, load_geography, missing_datasets

          record = load_geography("m-eurosat")
          assert record.name == "m-eurosat" and record.n > 0
          assert list_geography()[record.name] == record
          assert not missing_datasets()
          PYTHON
