name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run one deployment at a time without interrupting the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --locked --extra docs

      - name: Build HTML (warnings as errors)
        run: uv run --locked --extra docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
