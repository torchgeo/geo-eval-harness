name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds: one per ref; a newer push to a PR supersedes its running build.  On
# main a queued build is replaced by a newer one, so the latest merge deploys.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build HTML (warnings as errors)
        run: uv run --extra docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages accepts one deployment at a time and fails any request made while
    # another is in progress.  Only deploy jobs join this group, so a PR build
    # can no longer displace a pending main deployment, and a running one is
    # never cancelled mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
