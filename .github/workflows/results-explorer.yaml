name: Results explorer

# The explorer page is a build artifact of results/**.csv that happens to be
# committed.  Left to humans it drifts: the page on main quoted May's numbers
# for three months of merged results.  This keeps it in lockstep by opening a
# PR a maintainer can merge -- main is protected, so CI never pushes to it.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/results-explorer.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "results/models/**"
      - "results/profiles/**"
      - "results/intrinsic_dim/**"
      - "results/compute_cost.csv"
      - "scripts/regen_results_explorer.py"
      - "src/geo_eval_harness/results.py"
      - "src/geo_eval_harness/resume.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/results-explorer.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "results/models/**"
      - "results/profiles/**"
      - "results/intrinsic_dim/**"
      - "results/compute_cost.csv"
      - "scripts/regen_results_explorer.py"
      - "src/geo_eval_harness/results.py"
      - "src/geo_eval_harness/resume.py"
  workflow_dispatch:

# Serialise: two runs regenerating the same page would race on the branch.
# Don't cancel an in-flight main run -- a half-opened PR is worse than a slow one.
concurrency:
  group: results-explorer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regenerate:
    name: Regenerate results explorer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate
        run: uv run --frozen python scripts/regen_results_explorer.py

      - name: Show what changed
        run: git --no-pager diff --stat

      # On a PR, don't demand the contributor commit a 40 MB artifact -- just
      # prove the regeneration still works against their CSVs and let the
      # reviewer preview the page.  The refresh PR is opened from main.
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: results-explorer
          path: docs/_static/results-explorer.html
          retention-days: 14

      # Requires Settings -> Actions -> General -> "Allow GitHub Actions to
      # create and approve pull requests".  Note that a PR opened with the
      # default GITHUB_TOKEN does not itself trigger workflows; swap in a PAT
      # as `token:` if the refresh PR needs its own CI run before merge.
      - name: Open refresh PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676  # v7
        with:
          # Reuses one branch, so repeated result merges update the open PR
          # in place instead of piling up near-identical 40 MB PRs.
          branch: automation/results-explorer
          base: main
          add-paths: |
            docs/_static/results-explorer.html
            docs/_static/_results_snapshots
          commit-message: "chore(docs): refresh results explorer from results/*.csv"
          title: "chore(docs): refresh results explorer"
          body: |
            Regenerated `docs/_static/results-explorer.html` from the results
            CSVs on `main` via `scripts/regen_results_explorer.py`.

            Opened automatically because a results CSV changed. The diff is the
            re-inlined data plus the masthead, both derived from the CSVs — the
            page ships with no hand-written numbers, so this needs a read of the
            summary line rather than of the 40 MB payload.

            Triggered by ${{ github.sha }}.
          labels: automation
          delete-branch: true
