[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.6,<0.12" ]

[project]
name = "torchgeo-bench"
version = "0.5.0"
description = "Lightweight benchmarking framework for geospatial models"
readme = "README.md"
keywords = [
  "benchmark",
  "earth observation",
  "foundation models",
  "geospatial",
  "machine learning",
  "remote sensing",
]
license = { text = "MIT" }
authors = [
  { name = "Caleb Robinson", email = "calebrob6@gmail.com" },
  { name = "Isaac Corley", email = "isaac.a.corley@gmail.com" },
  { name = "Nils Lehmann", email = "nils.lehmann24@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "faissknn[cpu]>=0.4; sys_platform!='linux' or platform_machine!='x86_64'",
  "faissknn[cuda]>=0.4; sys_platform=='linux' and platform_machine=='x86_64'",
  "filelock>=3.12",
  "geobenchv2>=0.9",
  "h5py>=3.8",
  "huggingface-hub>=0.20",
  "lazy-loader>=0.4",
  "numpy>=1.24",
  "pandas>=2",
  # Required for CoordBench's Parquet files.
  "pyarrow>=14",
  "pydantic>=2",
  "pyyaml>=6",
  # Loads MIND's location-model weights.
  "safetensors>=0.4",
  "scikit-learn>=1.3",
  "timm>=0.9",
  "torch>=2",
  "torchgeo>=0.10,<0.11",
  "torchmetrics>=1.4",
  "torchvision>=0.15",
  "tqdm>=4.66",
  # SAM3 (Sam3Model / Sam3Config) and the DPT segmentation head.
  "transformers>=5.14",
]
optional-dependencies.all = [
  "torchgeo-bench[coordbench]",
  "torchgeo-bench[dev]",
  "torchgeo-bench[docs]",
  "torchgeo-bench[id]",
  "torchgeo-bench[lora]",
  "torchgeo-bench[olmoearth]",
  "torchgeo-bench[terratorch]",
]
optional-dependencies.coordbench = [
  "rshf>=0.2", # Required by SatCLIP, GeoCLIP, Climplicit, and SINR.
]
optional-dependencies.dev = [
  "evaluma>=0.3",         # Ranking backend for scripts/regen_leaderboard.py.
  "mdformat>=0.7.22",
  "pre-commit>=4.3",
  "pyproject-fmt>=2.21",
  "pyrefly==1.2",
  "pytest>=8.2",
  "pytest-cov>=7",
  "pytest-xdist>=3.6",
  "ruff==0.15.10",
  "torchgeo-bench[lora]", # Tests exercise the optional LoRA segmentation path.
  "ty>=0.0.21",
  "types-pyyaml>=6",
]
optional-dependencies.docs = [
  "linkify-it-py>=2",
  "myst-parser>=2",
  "pydata-sphinx-theme>=0.15",
  "sphinx>=7",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
]
optional-dependencies.id = [
  "torchid>=0.3; python_version>='3.13'",
]
optional-dependencies.lora = [
  "peft>=0.21", # LoRA segmentation fine-tuning.
]
optional-dependencies.olmoearth = [
  "olmoearth-pretrain-minimal>=0.0.6", # OlmoEarth v1.2 weights require this version.
]
optional-dependencies.terratorch = [
  "terratorch @ git+https://github.com/torchgeo/terratorch.git@main",
]
urls.Documentation = "https://torchgeo.org/torchgeo-bench/"
urls.Homepage = "https://github.com/torchgeo/torchgeo-bench"
urls.Issues = "https://github.com/torchgeo/torchgeo-bench/issues"
urls.Repository = "https://github.com/torchgeo/torchgeo-bench"
scripts.torchgeo-bench = "torchgeo_bench.cli:main"

[tool.hatch]
build.targets.wheel.packages = [ "src/torchgeo_bench" ]

[tool.uv]
build-backend.source-exclude = [ "/docs/_build" ]
build-backend.source-include = [ "docs/**" ]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "outputs",
]
extend-exclude = [
  "src/torchgeo_bench/cli.py",
  "src/torchgeo_bench/commands",
  "src/torchgeo_bench/config/schema.py",
  "src/torchgeo_bench/legacy_run.py",
  "src/torchgeo_bench/preprocessing.py",
]
lint.select = [
  "A",       # builtin shadowing
  "ARG",     # flake8-unused-arguments
  "B",       # flake8-bugbear
  "BLE001",  # blind exception catches
  "C4",      # flake8-comprehensions
  "C901",    # function complexity
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "ERA",     # commented-out code
  "F",       # pyflakes
  "FBT001",  # keyword-only boolean arguments
  "FBT002",  # keyword-only boolean defaults
  "G",       # lazy logging formatting
  "I",       # isort
  "LOG",     # logging API usage
  "NPY",     # NumPy API usage
  "PERF",    # unnecessary work
  "PGH004",  # blanket noqa
  "PIE",     # unnecessary code
  "PLR0911", # too many returns
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR5501", # collapsible else-if
  "PT",      # pytest style
  "RET505",  # else after return
  "RET506",  # else after raise
  "RET507",  # else after continue
  "RET508",  # else after break
  "RUF",     # Ruff-specific checks
  "SIM",     # flake8-simplify
  "T201",    # use logging for diagnostics
  "TID251",  # banned imports
  "TRY",     # exception handling
  "UP",      # pyupgrade
  "W",       # pycodestyle warnings
  "W505",    # long comments and docstrings
]
lint.ignore = [
  "B008",   # do not perform function calls in argument defaults
  "D104",   # missing docstring in public package
  "D105",   # missing docstring in magic method
  "D107",   # missing docstring in __init__ (documented in class docstring)
  "E501",   # Let the formatter handle line length.
  "SIM108", # allow explicit if/else
  "SIM116", # allow explicit branches
  "TRY003", # allow concise messages at the raise site
]
lint.per-file-ignores."projects/cleanlab/**/*.py" = [ "D" ]
lint.per-file-ignores."src/torchgeo_bench/cli.py" = [ "T201" ]  # CLI payloads go to stdout
lint.per-file-ignores."src/torchgeo_bench/commands/**/*.py" = [ "T201" ]
lint.per-file-ignores."tests/**/*.py" = [ "ARG", "D" ]
lint.flake8-tidy-imports.banned-api."__future__.annotations".msg = "Use ordinary annotations or quoted forward references."
lint.flake8-tidy-imports.banned-api."contextlib.suppress".msg = "Let errors propagate or use an explicit except clause with a reason."
lint.mccabe.max-complexity = 10
lint.pycodestyle.max-doc-length = 100
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 5
lint.pylint.max-branches = 12
lint.pylint.max-returns = 6
lint.pylint.max-statements = 50

[tool.pyrefly]
project-includes = [ "src/torchgeo_bench/**/*.py" ]
search-path = [ "src" ]
python-version = "3.12"
preset = "default"
# Optional extras are checked when installed.
ignore-missing-imports = [
  "olmoearth_pretrain_minimal",
  "olmoearth_pretrain_minimal.*",
  "rshf.*",
  "terratorch.*",
  "torchid",
]

[tool.pytest]
ini_options.addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--cov",
  "--cov-config=pyproject.toml",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "-m not slow and not accuracy_check",
]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src", "." ]
ini_options.markers = [
  "integration: offline workflows using toy data and real application components (included by default)",
  "slow: optional tests requiring downloaded datasets or pretrained weights (use -m slow to include)",
  "accuracy_check: per-class model accuracy regression tests (use -m accuracy_check to run)",
]

[tool.coverage]
run.branch = true
run.patch = [ "subprocess" ]
run.relative_files = true
run.source = [ "torchgeo_bench" ]
report.precision = 2
report.show_missing = true
